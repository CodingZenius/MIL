name: fitpulse
description: "FitPulse - a Material 3 fitness app with live activity detection, offline-first content, and dynamic dashboards."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Sensors / activity detection
  sensors_plus: ^6.1.1
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Networking for "dead backend" push-style content updates
  http: ^1.2.2

  # Video background for running mode
  video_player: ^2.9.2

  # Utility
  intl: ^0.19.0
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
    - assets/content/tips.json
